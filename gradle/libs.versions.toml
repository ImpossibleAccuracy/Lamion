[versions]
# Kotlin
kotlin = "2.0.20"
kotlin-coroutines = "1.9.0"
kotlin-datetime = "0.6.0"

# Spring
spring = "3.3.5"
spring-swagger = "2.6.0"

# Database
exposed = "0.52.0"
postgresql = "42.7.4"

# Ktor
ktor = "3.0.0"

# Other
netty = "1.1.22"
reactor = "1.2.3"
auth0 = "4.4.0"

[libraries]
# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlin-datetime" }

# Coroutines
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }
coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor", version.ref = "kotlin-coroutines" }

# Spring
spring-starter-boot = { module = "org.springframework.boot:spring-boot-starter", version.ref = "spring" }
spring-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "spring" }
spring-starter-security = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "spring" }
spring-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "spring" }
spring-devtools = { module = "org.springframework.boot:spring-boot-devtools", version.ref = "spring" }

# Web server
spring-starter-web = { module = "org.springframework.boot:spring-boot-starter-webflux", version.ref = "spring" }
netty-core = { module = "io.projectreactor.netty:reactor-netty-core", version.ref = "netty" }
netty-http = { module = "io.projectreactor.netty:reactor-netty-http", version.ref = "netty" }
reactor-kotlin = { module = "io.projectreactor.kotlin:reactor-kotlin-extensions", version.ref = "reactor" }

# Swagger
spring-swagger-ui = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "spring-swagger" }
spring-swagger-api = { module = "org.springdoc:springdoc-openapi-starter-webflux-api", version.ref = "spring-swagger" }

# Database
spring-exposed = { module = "org.jetbrains.exposed:exposed-spring-boot-starter", version.ref = "exposed" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

# Ktor
ktor-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-java = { module = "io.ktor:ktor-client-java", version.ref = "ktor" }
ktor-serialization = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-jackson", version.ref = "ktor" }

# OTHER
auth0 = { module = "com.auth0:java-jwt", version.ref = "auth0" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

spring-boot = { id = "org.springframework.boot", version.ref = "spring" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
