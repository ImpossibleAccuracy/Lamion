services:
  database:
    build:
      dockerfile: ./database/Dockerfile
      context: .
      target: "database-${DATABASE_PROFILE:?error}"
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./database/data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - database
  server:
    depends_on:
      database:
        condition: service_healthy
    build:
      dockerfile: server/app/Dockerfile
      context: .
    ports:
      - "8080:${API_PORT}"
    env_file:
      - .env
    environment:
      - PORT:${API_PORT}
      - DATABASE_URL=jdbc:postgresql://database:5432/$DATABASE_NAME
      - SERVER_URL=http://localhost:${API_PORT}/
    networks:
      - database
  worker:
    depends_on:
      database:
        condition: service_healthy
    build:
      dockerfile: server/worker/Dockerfile
      context: .
    ports:
      - "9000:${WORKER_PORT}"
    env_file:
      - .env
    environment:
      - PORT:${WORKER_PORT}
      - DATABASE_URL=jdbc:postgresql://database:5432/$DATABASE_NAME
    networks:
      - database

networks:
  database:
